name: Build Windows exe

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.13.0 pytest==8.3.5

      - name: Test
        run: python -m pytest -q tests

      - name: Build
        run: pyinstaller --noconfirm ISWM.spec

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/ISWM -DestinationPath ISWM-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ISWM-windows
          path: ISWM-windows.zip

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ISWM-windows.zip
