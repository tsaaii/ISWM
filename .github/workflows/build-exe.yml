name: Build Windows installer

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Test
        run: python -m pytest -q tests

      - name: Build exe
        run: python -m PyInstaller --noconfirm ISWM.spec

      - name: Check the built exe starts
        shell: pwsh
        run: |
          $log = "dist/ISWM/ISWM_data/logs/iswm.log"
          function Show-Log($why) {
            Write-Output "::error::$why"
            if (Test-Path $log) { Get-Content $log | Select-Object -Last 15 | ForEach-Object { Write-Output "::error::LOG $_" } }
            else { Write-Output "::error::no log file at $log" }
            $cl = "dist/ISWM/ISWM_data/logs/console.log"
            if (Test-Path $cl) { Get-Content $cl | Select-Object -Last 15 | ForEach-Object { Write-Output "::error::CONSOLE $_" } }
            exit 1
          }
          Get-ChildItem -Recurse dist/ISWM -File | ForEach-Object { Set-Content -Path ($_.FullName + ":Zone.Identifier") -Value "[ZoneTransfer]`r`nZoneId=3" }
          $c = Start-Process dist/ISWM/ISWM.exe -ArgumentList "--check" -Wait -PassThru
          if ($c.ExitCode -ne 0) { Show-Log "check failed with exit code $($c.ExitCode)" }
          $p = Start-Process dist/ISWM/ISWM.exe -ArgumentList "--browser" -PassThru
          Start-Sleep 15
          $ok = (Test-Path $log) -and (Select-String -Path $log -Pattern "serving" -Quiet)
          Stop-Process $p -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Show-Log "app did not start" }
          Get-Content $log
          Start-Sleep 2
          Remove-Item -Recurse -Force dist/ISWM/ISWM_data

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = python -c "import iswm; print(iswm.__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer\ISWM.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/ISWM -DestinationPath dist/ISWM-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ISWM-Setup
          path: dist/ISWM-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ISWM-portable
          path: dist/ISWM-portable.zip

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ISWM-Setup.exe
            dist/ISWM-portable.zip
