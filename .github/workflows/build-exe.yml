name: Build Windows installer

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Test
        run: python -m pytest -q tests

      - name: Build exe
        run: python -m PyInstaller --noconfirm ISWM.spec

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile installer/MicrosoftEdgeWebview2Setup.exe
          $version = python -c "import iswm; print(iswm.__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer\ISWM.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/ISWM -DestinationPath dist/ISWM-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ISWM-Setup
          path: dist/ISWM-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ISWM-portable
          path: dist/ISWM-portable.zip

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ISWM-Setup.exe
            dist/ISWM-portable.zip
